  <title>TechTalk Intel</title>
  <style>
    :root {
      --base: #080C14;
      --primary: #F8FAFC;
      --secondary: #E2E8F0;
      --accent: #38BDF8;
      --emerald: #10B981;
      --amber: #F59E0B;
      --coral: #FB7185;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080C14;
      color: #F8FAFC;
      font-family: "Space Grotesk", Inter, system-ui, sans-serif;
      padding: 48px 32px;
    }
    .logo { height: 64px; width: auto; }
    h1 { color: #F8FAFC; font-size: 40px; margin: 24px 0 8px; }
    p { color: #E2E8F0; max-width: 42rem; line-height: 1.5; }
    .accent { color: #38BDF8; }
    .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .swatch {
      width: 120px; height: 88px; border-radius: 8px;
      display: flex; align-items: flex-end; padding: 8px;
      font-size: 12px; font-family: ui-monospace, monospace;
    }
    .c-base { background: #080C14; color: #E2E8F0; border: 1px solid #334155; }
    .c-primary { background: #F8FAFC; color: #080C14; }
    .c-secondary { background: #E2E8F0; color: #080C14; }
    .c-accent { background: #38BDF8; color: #080C14; }
    .c-emerald { background: #10B981; color: #080C14; }
    .c-amber { background: #F59E0B; color: #080C14; }
    .c-coral { background: #FB7185; color: #080C14; }
  </style>
